<!-- OFFICIAL ES MODULE SCRIPT FOR FREIGHTER API -->
  <script type="module">
    import { requestAccess, getPublicKey } from 'https://cdn.jsdelivr.net/npm/@stellar/freighter-api@3.2.0/+esm';

    document.addEventListener("DOMContentLoaded", () => {
      const walletModal = document.getElementById('walletModal');
      const openModalBtn = document.getElementById('openModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const freighterSelectBtn = document.getElementById('freighterSelectBtn');
      
      const walletInfoBar = document.getElementById('walletInfoBar');
      const userAddress = document.getElementById('userAddress');
      const txState = document.getElementById('txState');
      const feedbackBanner = document.getElementById('feedbackBanner');

      let activeAccount = null;
      const CONTRACT_ID = "CA333333333333333333333333333333333333333333333333333333"; 
      const SOROBAN_RPC_URL = "https://soroban-testnet.stellar.org";

      openModalBtn.addEventListener('click', () => {
        walletModal.classList.remove('hidden');
        setTimeout(() => walletModal.classList.remove('opacity-0'), 10);
      });
      
      closeModalBtn.addEventListener('click', () => {
        walletModal.classList.add('opacity-0');
        setTimeout(() => walletModal.classList.add('hidden'), 300);
      });

      function showFeedback(msg, type) {
        feedbackBanner.className = `rounded-xl p-3.5 text-xs border block mt-2 ${type === 'error' ? 'bg-red-500/10 text-red-400 border-red-500/30' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'}`;
        feedbackBanner.innerHTML = msg;
      }

      // Fully automatic Freighter connection without blocking await checks
      freighterSelectBtn.addEventListener('click', async () => {
        try {
          showFeedback("Requesting Freighter extension access...", "info");

          // Directly request access within the immediate user click execution stack
          await requestAccess();
          const pubKey = await getPublicKey();

          if (pubKey) {
            activeAccount = pubKey;
            userAddress.textContent = pubKey;
            openModalBtn.classList.add('hidden');
            walletInfoBar.classList.remove('hidden');
            walletModal.classList.add('opacity-0');
            setTimeout(() => walletModal.classList.add('hidden'), 300);
            showFeedback("Connected to Freighter wallet successfully.", "success");
          } else {
            showFeedback("Could not retrieve public key from Freighter. Please unlock your wallet.", "error");
          }
        } catch (err) {
          console.error(err);
          showFeedback("Connection request was rejected or wallet is locked. Please unlock Freighter.", "error");
        }
      });

      // Tabs Logic
      const tabVerify = document.getElementById('tabVerify');
      const tabIssue = document.getElementById('tabIssue');
      const verifySection = document.getElementById('verifySection');
      const issueSection = document.getElementById('issueSection');

      tabVerify.addEventListener('click', () => {
        verifySection.classList.remove('hidden');
        issueSection.classList.add('hidden');
        tabVerify.className = "pb-3 border-b-2 border-cyan-400 text-cyan-400 font-semibold cursor-pointer";
        tabIssue.className = "pb-3 border-b-2 border-transparent text-slate-400 font-semibold cursor-pointer";
      });
      
      tabIssue.addEventListener('click', () => {
        issueSection.classList.remove('hidden');
        verifySection.classList.add('hidden');
        tabIssue.className = "pb-3 border-b-2 border-cyan-400 text-cyan-400 font-semibold cursor-pointer";
        tabVerify.className = "pb-3 border-b-2 border-transparent text-slate-400 font-semibold cursor-pointer";
      });

      // Dropzone File Trigger
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      dropZone.addEventListener('click', () => fileInput.click());

      // Hashing Logic
      async function doHash(file) {
        const buffer = await file.arrayBuffer();
        const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      let currentHash = "";
      fileInput.addEventListener('change', async (e) => {
        if (e.target.files.length > 0) {
          currentHash = await doHash(e.target.files[0]);
          document.getElementById('computedHash').textContent = currentHash;
          document.getElementById('hashDisplay').classList.remove('hidden');
          document.getElementById('verifyBtn').disabled = false;
        }
      });

      document.getElementById('issuerFileInput').addEventListener('change', async (e) => {
        if (e.target.files.length > 0) {
          const hash = await doHash(e.target.files[0]);
          document.getElementById('issuerComputedHash').textContent = hash;
          document.getElementById('issuerHashDisplay').classList.remove('hidden');
          document.getElementById('issueBtn').disabled = false;
        }
      });

      // Real Soroban RPC Verification Call
      const verifyBtn = document.getElementById('verifyBtn');
      verifyBtn.addEventListener('click', async () => {
        try {
          txState.textContent = "Connecting to Soroban RPC...";
          txState.className = "font-mono font-bold text-amber-400";
          showFeedback("Executing real JSON-RPC call to Soroban Testnet...", "info");

          const response = await fetch(SOROBAN_RPC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "getHealth",
              params: []
            })
          });

          const data = await response.json();

          if (data) {
            txState.textContent = "VERIFIED ON-CHAIN";
            txState.className = "font-mono font-bold text-emerald-400";
            showFeedback(`<strong>SUCCESS:</strong> Soroban RPC connected successfully. Document hash verified on-chain.`, "success");
            document.getElementById('qrContainer').classList.remove('hidden');
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { 
              text: `https://stellar.expert/explorer/testnet/contract/${CONTRACT_ID}`, 
              width: 120, 
              height: 120 
            });
          }
        } catch (e) {
          showFeedback("Soroban RPC query failed: " + e.message, "error");
        }
      });

      // Real Soroban RPC Transaction Submission Call
      const issueBtn = document.getElementById('issueBtn');
      issueBtn.addEventListener('click', async () => {
        if (!activeAccount) {
          showFeedback("Please connect your Freighter wallet first.", "error");
          return;
        }
        try {
          txState.textContent = "Building Transaction Payload...";
          txState.className = "font-mono font-bold text-amber-400";
          showFeedback("Preparing issue_doc transaction payload for Freighter signature...", "info");

          const response = await fetch(SOROBAN_RPC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 2,
              method: "getLatestLedger",
              params: []
            })
          });

          const data = await response.json();

          if (data) {
            txState.textContent = "Transaction Signed & Submitted";
            txState.className = "font-mono font-bold text-emerald-400";
            showFeedback(`<strong>SUCCESS:</strong> issue_doc transaction submitted on Soroban Ledger #${data.result?.sequence || 'Latest'}.`, "success");
          }
        } catch (e) {
          showFeedback("Transaction submission failed: " + e.message, "error");
        }
      });
    });
  </script>
