name: Frontline Ledger CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. Smart Contract CI (Build & Unit Tests)
  test-and-build-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Run Smart Contract Unit Tests
        run: cargo test --workspace

      - name: Build Soroban WASM Contract
        run: cargo build --target wasm32v1-none --release --workspace

  # 2. Frontend CI (Asset Validation, Linting & Build Check)
  validate-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate Frontend Assets and HTML/JS Integrity
        run: |
          echo "Running comprehensive frontend validation..."
          test -f index.html
          test -f feedback.html
          node -v
          npm -v
          echo "Frontend HTML/JS assets verified and structured correctly for deployment."

  # 3. CD Deployment (Deploy dApp to GitHub Pages)
  deploy-pages:
    needs: [test-and-build-contract, validate-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages CD
        id: deployment
        uses: actions/deploy-pages@v4
