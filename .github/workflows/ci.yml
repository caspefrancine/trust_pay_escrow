name: TrustPay Escrow Level 3 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Run Smart Contract Tests
      run: cargo test --manifest-path contracts/trust_pay_escrow/Cargo.toml

    - name: Build Soroban WASM Contract
      run: cargo build --manifest-path contracts/trust_pay_escrow/Cargo.toml --target wasm32-unknown-unknown --release
